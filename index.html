<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Mesh — Altitude LiDAR</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
</head>
<body>
  <div id="map"></div>

  <div id="busy-overlay" class="hidden">
    <div class="busy-box">
      <div class="spinner"></div>
      <span id="busy-label">Chargement…</span>
    </div>
  </div>

  <aside id="panel">
    <h1>Radio Mesh</h1>
    <p class="subtitle">Altitude d'un point (LiDAR / RGE ALTI)</p>

    <section class="hint" id="hint">
      Cliquez sur la carte pour connaître l'altitude d'un point.
    </section>

    <section class="results hidden" id="results">
      <div class="row"><span>coords</span><strong id="click-coords">—</strong></div>
      <div class="row"><span>Hauteur</span><strong id="z-height">—</strong></div>
      <div class="row"><span>Altitude du sol (MNT)</span><strong id="z-ground">—</strong></div>
      <div class="row"><span>Altitude surface (MNS)</span><strong id="z-surface">—</strong></div>
    </section>

    <p class="status" id="status"></p>

    <footer>
      Données : <a href="https://geoservices.ign.fr/" target="_blank" rel="noopener">IGN Géoplateforme</a> ·
      Fond : <a href="https://www.openstreetmap.fr/" target="_blank" rel="noopener">OSM France HOT</a>
    </footer>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/alti.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
